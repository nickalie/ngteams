[workspace]
resolver = "3"
# Explicit list: cargo refuses a glob that matches nothing. Every new crate is added here.
members = [
    "crates/fixture-guard",
    "crates/proto-lab",
    "crates/ngteams",
    "crates/teams-auth",
    "crates/teams-call",
    "crates/teams-core",
    "crates/teams-ctl",
    "crates/teams-log",
    "crates/teams-media",
    "crates/teams-mock",
    "crates/teams-platform",
    "crates/teams-runner",
    "crates/teams-proto",
    "crates/teams-signin",
    "crates/teams-signin-extension",
    "crates/teams-signin-protocol",
    "crates/teams-store",
    "crates/teams-trouter",
    "crates/teams-web-engine",
    "crates/teams-update",
    "crates/teams-ui",
    "crates/teams-wpe",
    "crates/teams-wpe-client",
    "crates/ui-sandbox",
    "crates/wpe-javascriptcore-sys",
    "crates/wpe-platform-sys",
    "crates/wpe-webkit-sys",
    "spikes/gpui-video",
]
# Every member but the personal build (`crates/ngteams`): a plain `cargo build`, `cargo build --release` or `cargo run`
# at the root never builds it (docs/personal-build.md; crates/ngteams/tests/apart.rs checks this list).
default-members = [
    "crates/fixture-guard",
    "crates/proto-lab",
    "crates/teams-auth",
    "crates/teams-call",
    "crates/teams-core",
    "crates/teams-ctl",
    "crates/teams-log",
    "crates/teams-media",
    "crates/teams-mock",
    "crates/teams-platform",
    "crates/teams-runner",
    "crates/teams-proto",
    "crates/teams-signin",
    "crates/teams-signin-extension",
    "crates/teams-signin-protocol",
    "crates/teams-store",
    "crates/teams-trouter",
    "crates/teams-web-engine",
    "crates/teams-update",
    "crates/teams-ui",
    "crates/teams-wpe",
    "crates/teams-wpe-client",
    "crates/ui-sandbox",
    "crates/wpe-javascriptcore-sys",
    "crates/wpe-platform-sys",
    "crates/wpe-webkit-sys",
    "spikes/gpui-video",
]
# Patched crates.io sources (scripts/vendor-crates.sh), used through [patch.crates-io], never workspace members.
exclude = ["vendor"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
publish = false
license = "MIT OR Apache-2.0"

# Shared dependency versions; crates take them with `name.workspace = true`.
[workspace.dependencies]
fixture-guard = { path = "crates/fixture-guard" }
proto-lab = { path = "crates/proto-lab" }
teams-auth = { path = "crates/teams-auth" }
# a call's signaling state machine (sans-IO): builds the sealed call writes, sends nothing itself
teams-call = { path = "crates/teams-call" }
teams-core = { path = "crates/teams-core" }
# the control socket's protocol, paths, codec and client (`ngteamsctl`); the app's server is in crates/ngteams
teams-ctl = { path = "crates/teams-ctl" }
# the app's diagnostic log (M2 Task 24a): installed by the app crates only, through its `install`
teams-log = { path = "crates/teams-log" }
# a call's media: Teams' SDP dialect (sdp-ngc-1.0), the relayed libwebrtc peer and its session, the mixer's control
# plane and the device seam
teams-media = { path = "crates/teams-media" }
# tests only: a crate takes it under [dev-dependencies], never [dependencies] (crates/teams-mock/tests/mock.rs checks)
teams-mock = { path = "crates/teams-mock" }
teams-platform = { path = "crates/teams-platform" }
teams-proto = { path = "crates/teams-proto" }
# the host-gated sign-in window library, used in-process by ngteams
teams-signin = { path = "crates/teams-signin" }
# the sign-in window's web process extension; `teams-signin` depends on it, so its build builds the module
teams-signin-extension = { path = "crates/teams-signin-extension" }
teams-signin-protocol = { path = "crates/teams-signin-protocol" }
teams-store = { path = "crates/teams-store" }
teams-trouter = { path = "crates/teams-trouter" }
# the GPUI views and models over the engine
teams-ui = { path = "crates/teams-ui" }
# WPE WebKit offscreen (taken from ngterm's `ngterm-wpe`, MIT): the sign-in window's engine, in a worker process of
# its own, its frames in shared memory and the window's input forwarded to it
teams-wpe = { path = "crates/teams-wpe" }
teams-web-engine = { path = "crates/teams-web-engine" }
# the installed app's updates from its GitHub releases: checked, downloaded, verified and installed
teams-update = { path = "crates/teams-update" }
teams-wpe-client = { path = "crates/teams-wpe-client" }
# the gir bindings `teams-wpe` is written over (taken from ngterm, MIT; generated, so they set their own lints)
wpe-javascriptcore-sys = { path = "crates/wpe-javascriptcore-sys" }
wpe-platform-sys = { path = "crates/wpe-platform-sys" }
wpe-webkit-sys = { path = "crates/wpe-webkit-sys" }
# tests and lab runs only: the private compositor, bus, input and URI opener every GUI process runs in
ui-sandbox = { path = "crates/ui-sandbox" }
# The video source hands frames to GPUI's foreground executor: the version GPUI already links.
async-channel = "2.5.0"
# base64 bodies and frames in captures, decoded by the sanitizer
base64 = "0.23.1"
# the chat list's times in the local time zone (read from TZ and the zoneinfo files, no libc localtime): the version
# the UI kit already links, with only its clock
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
# the scheduling form's start and end time zones: the IANA zones and their offsets at a time (no logging of its own,
# so nothing of it reaches the compile-time log cap)
chrono-tz = { version = "0.10.4", default-features = false, features = ["std"] }
# The desktop's IANA zone on Windows and Unix; already used by Chrono. No runtime logging on either platform.
iana-time-zone = "0.1.65"
# Native known folders on Windows, including redirected Downloads. Already resolved by GPUI; no runtime logging.
dirs = "6.0.0"
clap ={ version = "4.6.7", features = ["derive"] }
# `ngteamsctl completions`: the shells' completion scripts of its command line, for the clap the workspace takes
# (no logging of its own, so nothing of it reaches the compile-time log cap)
clap_complete = "4.6.11"
# STUN FINGERPRINT (CRC-32) for the echo call's TURN client
crc32fast = "1.5.2"
# gzip only, on the zlib-rs backend zip already uses
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
# the futures libwebrtc's bindings return, run to completion on the media's own threads (no runtime of theirs)
futures-executor = "0.3.34"
# the tree scraper parses into, walked without recursion: the version scraper takes
ego-tree = "0.11.0"
# a shared video file played in its card (teams-media's player): GStreamer's playbin (demultiplexing, decoding with the
# system's plugins, A/V sync, seeking, volume) through its Rust bindings (MIT/Apache-2.0; GStreamer itself, LGPL, is
# the system's, linked dynamically); its bytes from an appsrc the engine feeds, its frames and sound to appsinks
gstreamer = "0.25.2"
gstreamer-app = "0.25.2"
# the system random source: PKCE verifiers and OAuth state
getrandom = "0.4.3"
# GPUI as agterm-rs takes it: the crates.io `gpui-pre` snapshot, pinned exactly so agterm-rs's patches apply as they
# are. Wayland only: without `x11`, GPUI's Linux platform has no X11 backend to fall back to.
gpui-pre = { version = "=0.3.9", default-features = false, features = ["wayland"] }
# `runtime_shaders` acts on macOS only: Metal compiles GPUI's shaders when the app starts instead of at build time,
# so a build needs no separately downloaded Metal Toolchain (Xcode 26 and later leave it out).
gpui-pre-platform = { version = "=0.3.9", default-features = false, features = ["wayland", "runtime_shaders"] }
# The sign-in window's engine (`teams-wpe`) and its web process extension: GLib and GIO as WPE WebKit 2.54 links
# them, through gtk-rs; the extension calls `g_variant_*` and `g_signal_connect_data` by hand on the -sys crates
gio = "0.22.10"
gio-sys = "0.22.9"
glib = "0.22.10"
glib-sys = "0.22.9"
gobject-sys = "0.22.9"
soup-sys = { package = "soup3-sys", version = "0.9.0" }
# the WPE bindings' build scripts find the system's WPE WebKit through pkg-config
pkg-config = "0.3.34"
system-deps = "7.0.8"
# `teams-wpe`'s input modifiers and page settings
bitflags = { version = "2.13.2", features = ["serde"] }
# The UI kit (Apache-2.0; M2 Task 7's audit): built for `gpui-pre =0.3.9`, so it resolves to the vendored patched
# copy above. It takes `gpui-pre` with its default features, so the workspace's GPUI gains `x11`, `font-kit` and
# `windows-manifest` (the lab app refuses a set `DISPLAY`); none of the kit's own optional features.
gpui-component = { version = "0.8.0", default-features = false }
# The kit's icons, by the paths its components draw them from (`teams_ui::AppAssets`): the kit's own assets crate
# (Apache-2.0; Lucide's SVGs, ISC/MIT), the version the kit locks
gpui-kit-assets = { version = "0.8.0", default-features = false }
# GPUI's `RenderImage` frames are `image` buffers: the version GPUI already links.
image = { version = "0.25.10", default-features = false }
# Keep the decoder's allocation bounds when resolving image's transitive dependencies.
image-webp = "=0.2.4"
# STUN MESSAGE-INTEGRITY (HMAC-SHA1 over a long-term key) for the echo call's TURN client
hmac = "0.13.0"
# a Retry-After given as an HTTP date
httpdate = "1.0.3"
# the UI sandbox's spawn marks every inherited descriptor but the named ones close-on-exec (`close_range`, which rustix
# doesn't wrap): the version the workspace already links
libc = "0.2.191"
# The calls' media (teams-media): Google's libwebrtc, the engine Chrome and Teams' web client run, through LiveKit's
# bindings (Apache-2.0). ICE through Teams' TURN relay, DTLS-SRTP, Opus and H.264 (hardware encoding through VA-API
# where libva is installed), the jitter buffer, bandwidth estimation, A/V sync and the audio processing module are
# libwebrtc's. Its build script downloads LiveKit's prebuilt static libwebrtc (`webrtc-linux-x64-release`, with
# FFmpeg's H.264 decoder in it) from GitHub on a clean build (`LK_CUSTOM_WEBRTC` names a local one instead), so the
# build-time `reqwest` it pulls in never reaches a binary. Pinned exactly: its API moves between patch releases.
libwebrtc = "=0.3.55"
log = "0.4.34"
# the STUN long-term credential key: MD5(username:realm:password), RFC 8489 9.2.2
md-5 = "0.11.0"
# decodes the chat service's encoded conversation IDs and request path segments
percent-encoding = "2.3.2"
# a meeting recording's DASH presentation (an MPD) read into its tracks: the version the tree already locks
roxmltree = "0.21.1"
# The async-io flavour GPUI's Linux platform takes too: its ashpd and zbus refuse to build with both `async-io` and
# `tokio` on, and workspace builds unify features, so oo7's default `tokio` would break every workspace build with
# GPUI in it. async-io runs its own reactor thread, so the futures still run under tokio.
oo7 = { version = "0.6.0", default-features = false, features = ["async-std", "native_crypto"] }
# The device seam's PipeWire backend (teams-media): audio and the camera on one server, the sandbox's or the
# desktop's as the caller selects at run time (libpipewire through bindgen; MIT)
pipewire = { version = "0.10.1", features = ["v0_3_49"] }
# the Public Suffix List, compiled in: which dotted part of a display name ends in a real top-level domain
psl = "2.1.243"
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs"] }
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2"] }
# the Trouter socket checks the server certificate as reqwest does (the system verifier)
rustls-platform-verifier = "0.7.1"
# the local store: SQLite built from source (`bundled`), so every machine runs the same version
rusqlite = { version = "0.40.2", features = ["array", "bundled"] }
rustix = { version = "1.1.5", features = ["process"] }
# the chat service's message HTML, read into a small typed model (teams-proto's `chat::html`): html5ever's
# browser-grade parse, as a tree to walk; without the CLI (`main`) and the parse-error list (`errors`)
scraper = { version = "0.27.0", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.1"
# what a proposed correction changed in a draft, word by word (`teams-ui`'s `message_correct::diff`), as the UI kit links it
similar = "2.7.0"
# the sign-in engine's downloaded runtime (`teams-web-engine`): a blocking GET with no credentials, a tar.zst unpacked
# by its own confined rules, and the system engine's version compared
semver = "1.0.28"
tar = "0.4.46"
ureq = { version = "3.5.1", default-features = false, features = ["rustls"] }
zstd = "0.14.3"
tempfile = "3.27.0"
thiserror = "2.0.21"
# the chat service's ISO times (a message's `composetime`, `originalarrivaltime`), read as RFC 3339
time = { version = "0.3.55", features = ["parsing"] }
tokio = "1.53.3"
tokio-rustls = { version = "0.26.6", default-features = false, features = ["aws_lc_rs"] }
tokio-tungstenite = "0.30.0"
toml = "1.1.8"
# edits lab.toml in place (the MRI of an account after its first login), keeping its comments
toml_edit = "0.25.17"
# The camera's background effects (teams-media): MediaPipe's selfie segmenter, converted to ONNX, run on the CPU by
# tract (Sonos; MIT/Apache-2.0), pure Rust: no system library, a few milliseconds a frame. Without its `transformers`
# ops, which the model doesn't use.
tract-onnx = { version = "0.23.9", default-features = false }
# ... and the same model on the GPU where there is one: Burn (Tracel; MIT/Apache-2.0), pure Rust, its wgpu backend
# (Vulkan; kernel fusion, no autotune: autotuning a model this small costs a minute of GPU on its first run) through
# CubeCL. The model's code and weights are generated from the ONNX at build time by burn-onnx (teams-media's build
# script). wgpu here is its own version, beside GPUI's. The graphics API is chosen per target in teams-media: Vulkan on
# Linux and Windows, Metal on macOS (Vulkan there would need the Vulkan SDK at build time). Their logs under the `debug` cap (crates/teams-log) name the
# adapter's features and the kernels compiled; the kernels' sources are `trace`, compiled out: no frame data.
burn = { version = "0.22.0", default-features = false, features = ["std", "wgpu", "fusion"] }
burn-onnx = { version = "0.22.0", default-features = false, features = ["import"] }
burn-store = { version = "0.22.1", default-features = false, features = ["std"] }
cubecl = { version = "0.11.3", default-features = false, features = ["wgpu"] }
# tests only: the UI kit's `tracing` events forwarded to `log` (its `log` feature, no subscriber), the version the kit
# already links
tracing = { version = "0.1.44", default-features = false }
trybuild = "1.0.122"
url = "2.5.8"
# The UI sandbox's virtual keyboard and pointer: a Wayland client of the nested niri, on the versions GPUI already
# links (wayland-client, the wlr protocols) and the misc protocols built for them (`zwp_virtual_keyboard_v1`).
wayland-client = "0.31.15"
wayland-protocols-misc = { version = "0.3.12", features = ["client"] }
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }
wiremock = "0.6.5"
# Native Windows executable icon resources, sharing GPUI's existing build dependency.
embed-resource = "3.0.12"
# Native Windows filesystem security, with no logging of its own.
widestring = "1.2.1"
windows-sys = "0.61.2"
windows = "0.62.2"
windows-core = "0.62.2"
webview2-com = "0.39.1"
wry = { version = "0.57", default-features = false }
raw-window-handle = "0.6"
# Native screen/window picker and Windows Graphics Capture; MIT, no logging dependency.
windows-capture = "=2.0.1"
# Windows broker byte streams through maintained local named-pipe bindings.
interprocess = { version = "2.4.6", default-features = false }
# Native Windows Credential Manager, selected explicitly without a process-wide default keyring.
keyring-core = "1.0.1"
windows-native-keyring-store = { version = "1.1.0", default-features = false }
# macOS's AppKit, Foundation and WebKit (the sign-in worker's window and page, the desktop's dock and menu bar items):
# objc2's bindings at the versions GPUI's macOS platform already links (MIT); no logging of their own
block2 = "0.6.2"
objc2 = "0.6.5"
objc2-app-kit = "0.3.2"
objc2-foundation = "0.3.2"
objc2-web-kit = "0.3.2"
# The macOS Keychain (generic password items): the version rustls-platform-verifier already links on macOS; no logging.
# Its -sys crate and core-foundation (the versions it links) for the lab keychain's item access rules.
core-foundation = "0.10.1"
security-framework = "3.7.0"
security-framework-sys = "2.17.0"
# the virtual keyboard's keymap and its text-to-key table: the version GPUI already links, without its features
xkbcommon = { version = "0.8.0", default-features = false }
# D-Bus for the app's notifications and tray item (M2 Task 14), the personal build's camera portal (M3 Task 20) and the
# UI sandbox's fake notification server, tray watcher and camera portal: the version and the async-io flavour GPUI's ashpd already takes (a `tokio` flavour breaks every workspace
# build with GPUI in it, as for oo7). 5.19.0 is what GPUI links; crates.io's newest was 6.0.0 on 2026-10-22, which
# would put a second zbus in the tree.
zbus = { version = "5.19.0", default-features = false, features = ["async-io", "blocking-api"] }
zeroize = "1.9.1"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }

# Same lint set as agterm-rs. Every crate opts in with `[lints] workspace = true`, spikes included; only generated
# -sys crates may set their own (scripts/lint-report.sh). A function over a complexity limit (clippy.toml) is split,
# not excused: the only exception is an outer `#[expect(clippy::..., reason = "...")]` on that one item.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
# complexity (thresholds in clippy.toml)
cognitive_complexity = "deny"
too_many_lines = "deny"
excessive_nesting = "deny"
too_many_arguments = "deny"
type_complexity = "deny"
fn_params_excessive_bools = "deny"
struct_excessive_bools = "deny"
# robustness
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
# FFI
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
# exceptions
allow_attributes = "deny"
allow_attributes_without_reason = "deny"

# Debug builds keep line tables only (file:line in backtraces and panics, no variable info for a debugger): full
# debuginfo, statically linked into every test binary, grew target/ to hundreds of GB.
[profile.dev]
debug = "line-tables-only"

# The gpui-video spike converts 1280x720 frames on the CPU; unoptimized, one conversion takes ~250 ms, so even the
# debug tests of its video grid get optimized code for that crate (its dependencies stay as they are).
[profile.dev.package.gpui-video]
opt-level = 3

# The person segmentation of the camera's background effects runs tract's kernels on every frame: unoptimized they
# take most of a second a frame, so a debug build (the lab app, the tests) gets them optimized.
[profile.dev.package.tract-linalg]
opt-level = 3
[profile.dev.package.tract-core]
opt-level = 3

# GPUI with agterm-rs's external-surfaces patches (M0 Task 16, approach (b) of the video spike):
# `Window::paint_external_surface` draws CPU pixels uploaded into a texture kept per surface, or a dmabuf imported on
# the GPU, instead of a new sprite atlas texture per video frame. vendor/gpui-pre and vendor/gpui-pre-wgpu are the verified crates.io sources of the
# pinned 0.3.9 plus build/patches/gpui-pre{,-wgpu} (scripts/vendor-crates.sh; `--check` verifies them); so is
# vendor/gpui-pre-linux, whose Wayland clipboard keeps another program's HTML for the rich-text editor's paste.
[patch.crates-io]
gpui-pre = { path = "vendor/gpui-pre" }
gpui-pre-wgpu = { path = "vendor/gpui-pre-wgpu" }
gpui-pre-linux = { path = "vendor/gpui-pre-linux" }
gpui-pre-windows = { path = "vendor/gpui-pre-windows" }
# image-webp 0.2.4 plus build/patches/image-webp (scripts/vendor-crates.sh): teams-ui's WebP budget relies on
# bounded lossless Huffman storage and VP8 dimensions checked before allocation; keep until upstream bounds both.
image-webp = { path = "vendor/image-webp" }
# LiveKit's libwebrtc bindings, the pinned 0.3.55 plus build/patches/libwebrtc (scripts/vendor-crates.sh):
# `RtpTransceiver::set_direction`, which webrtc-sys binds and the safe API leaves out (0.4.0 too). A group call's screen
# goes out on the mixer's sharing line, turned to send before the answer (crates/teams-media/src/rtc.rs). Only the Rust
# crate is patched: webrtc-sys and its prebuilt libwebrtc stay crates.io's. Candidate-pair RTT also preserves field
# presence, so a measured zero differs from an absent statistic. Keep the patches until upstream exposes direction
# and preserves optional RTT values.
libwebrtc = { path = "vendor/libwebrtc" }
# burn-tch, Burn's LibTorch backend, swapped for an empty stub (vendor/burn-tch): burn-dispatch names it only in weak
# features (`burn-tch?/std`), which Cargo still writes into Cargo.lock (rust-lang/cargo#10801), and with it tch 0.22 and
# torch-sys 0.22's zip 0.6.6 (GHSA zip cloaking, AES HMAC bypass), though no build enables the backend. The stub keeps
# the vulnerable zip out of the lockfile. Remove it with the move to burn 0.23, which drops burn-tch.
burn-tch = { path = "vendor/burn-tch" }
