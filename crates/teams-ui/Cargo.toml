[package]
name = "teams-ui"
description = "The GPUI views and models of the native Teams client over teams-core's engine: the bridge that owns the engine, the models it keeps up to date, the shell, the chat list, the chat switcher, the settings, the view trace; no request path of its own"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[features]
# Tests only, through dev-dependencies: hooks the app's UI tour reads (where a chat view last drew each sender's face,
# `ChatView::face_bounds`). It also turns on teams-proto's test support, so ngteams refuses to run.
test-support = ["teams-proto/test-support"]

[dependencies]
# a call's video frames wake the window from the media's threads
async-channel.workspace = true
# the chat list's times, in the local time zone
chrono.workspace = true
# the scheduling form's start and end time zones
chrono-tz.workspace = true
# the scheduling form's desktop zone on both native platforms
iana-time-zone.workspace = true
# the bridge's drain: the engine's next event or the stop, whichever comes first
futures-util.workspace = true
gpui-pre.workspace = true
# the bridge's shutdown and sign-out in the app's diagnostic log; capped at `debug` at compile time like teams-trouter's
log = { workspace = true, features = ["max_level_debug", "release_max_level_debug"] }
# the UI kit: compose's text area, the theme, the resizable panes, the command palette (the chat switcher), avatars,
# buttons, switches and radios
gpui-component.workspace = true
# the kit's icons, served by the paths its components ask for (`AppAssets`)
gpui-kit-assets.workspace = true
# the view trace: one JSON object per line; a recap's AI summary kept as a file, and the tool's answer read
serde.workspace = true
serde_json.workspace = true
# a recap's AI summary's file named by a hash of its recording's link
sha2.workspace = true
# a reaction's animation strip (a PNG) cut into the frames GPUI plays, and a message's pictures (PNG, JPEG, GIF,
# WebP) decoded: the version and decoders GPUI already links
image = { workspace = true, features = ["png", "jpeg", "gif", "webp"] }
# a proposed correction's changes to a draft, word by word
similar.workspace = true
# the engine: its request side (behind `Core`), its events and its shutdown
teams-core.workspace = true
# a message's content read as rich text, for the chat list's preview line (sanitized, capped; never shown as HTML)
teams-proto.workspace = true
# the rows the engine's queries answer with
teams-store.workspace = true
# the incoming call's ringtone: the device seam's speaker (the PipeWire selected at startup) and its tones; a call's
# video frames, turned into the pixels a window draws
teams-media.workspace = true
# the diagnostic log's level in the settings (changed live) and the "copy diagnostics" text; never installed here
teams-log.workspace = true
teams-platform.workspace = true
url.workspace = true
# the settings file's problems
thiserror.workspace = true
# the bridge's stop signal to its drain task (a runtime-free oneshot)
tokio = { workspace = true, features = ["sync"] }
# the settings file
toml.workspace = true
# a sound pack the user imports as an archive (deflate only; entries read by name, never unpacked by their paths)
zip.workspace = true

[dev-dependencies]
# a synthetic card message's Swift payload (`tests/chat_view/cards.rs`)
base64.workspace = true
# a call's id for the fake engine's call events (`CallId::for_tests`)
teams-call = { workspace = true, features = ["test-support"] }
# the views on GPUI's test context (`TestAppContext`): a fake core and a fake event source, no window system
gpui-pre = { workspace = true, features = ["test-support"] }
# the kit's widgets on GPUI's test context
gpui-component = { workspace = true, features = ["test-support"] }
# the kit's text area on the real platform, in the UI sandbox: GPUI's Linux platform, Wayland only
gpui-pre-platform = { workspace = true, features = ["test-support"] }
# the settings file, in a directory of its own per test
tempfile.workspace = true
# compose on two accounts' engines on the mock (`tests/compose_mock.rs`): their tokens, the mock chat service and
# its Trouter reached through the test-support mock origins
teams-auth.workspace = true
teams-mock.workspace = true
teams-proto = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "time"] }
# the push channel's events the fake engine hands the bridge; the mock's Trouter for compose's two-account test
teams-trouter = { workspace = true, features = ["test-support"] }

[[test]]
# the kit's text area and the theme in the UI sandbox: its own `main` (GPUI runs on the main thread), which runs
# itself again inside the sandbox
name = "kit_window"
harness = false

[[test]]
# A real Wayland text/uri-list drag from another process into the composer, in the private sandbox.
name = "attachment_window"
harness = false

[[test]]
# the chat list drawn on the real platform in the UI sandbox over the fake engine, screenshotted in each theme under
# `target/ui-shots/chat-list-*.png`: its own `main` (GPUI runs on the main thread), which runs itself again inside the
# sandbox
name = "chat_list_window"
harness = false

[[test]]
# what GPUI's own system notifications do on the sandbox's bus: its own `main`, which runs itself again inside the
# sandbox
name = "gpui_notification"
harness = false

[[test]]
# bold, semibold and italic text drawn in the UI sandbox and measured from its screenshot, kept as
# `target/ui-shots/font-styles.png`: its own `main` (GPUI runs on the main thread), which runs itself again inside the
# sandbox
name = "font_styles"
harness = false

[[test]]
# a draft translated in its box, drawn in the UI sandbox over the fake engine and a fake translator, screenshotted in
# each theme under `target/ui-shots/compose-translate-*.png`: its own `main` (GPUI runs on the main thread), which runs
# itself again inside the sandbox
name = "compose_translate_window"
harness = false

[[test]]
# the account's own notes opened from "Favorites", drawn in the UI sandbox over the fake engine, screenshotted in each
# theme under `target/ui-shots/notes-*.png`: its own `main` (GPUI runs on the main thread), which runs itself again
# inside the sandbox
name = "notes_window"
harness = false

[[test]]
# a meeting's chat with every kind of system message Teams shows in one, drawn in the UI sandbox over the fake engine,
# screenshotted in each theme under `target/ui-shots/meeting-*.png`: its own `main` (GPUI runs on the main thread),
# which runs itself again inside the sandbox
name = "meeting_window"
harness = false

[[test]]
# the faces of people whose camera is off in a call (their pictures, else their initials): 1:1 and group calls over the
# fake engine in the UI sandbox, screenshotted under `target/ui-shots/call-faces-*.png`
name = "call_faces_window"
harness = false

[[test]]
# a meeting chat's tabs (its Recap, with two recordings, their transcripts searched, a meeting transcribed only, and its
# Shared tab) over the fake engine in the UI sandbox, screenshotted under `target/ui-shots/recap-*.png`
name = "recap_window"
harness = false

[[test]]
name = "workflow_window"
harness = false

[[test]]
# workflows run from a message over the fake engine, in the UI sandbox, screenshotted in each theme under
# `target/ui-shots/workflow-message-*.png`
name = "workflow_message_window"
harness = false

[[test]]
# the Workflows app in the main window over the fake engine, in the UI sandbox, screenshotted in each theme under
# `target/ui-shots/workflows-app-*.png`
name = "workflows_app_window"
harness = false

[target.'cfg(unix)'.dependencies]
zbus.workspace = true

[target.'cfg(unix)'.dev-dependencies]
# Linux compositor, private bus and virtual keyboard; Windows uses the authorized VM console.
ui-sandbox.workspace = true

[target.'cfg(windows)'.dependencies]
dirs.workspace = true
# Native desktop shell and WinRT toasts; no optional logging features.
windows = { workspace = true, features = ["Data_Xml_Dom", "Foundation", "UI_Notifications", "Win32_Foundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_System_WinRT", "Win32_UI_Accessibility", "Win32_UI_Notifications", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem", "Win32_UI_WindowsAndMessaging"] }
windows-core.workspace = true
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
raw-window-handle.workspace = true
# Claude's npm shim cannot receive multiline arguments; keep its private prompt file until the job exits.
tempfile.workspace = true

[lints]
workspace = true

[[test]]
# Real sandbox rendering of channel management over synthetic data, in light and dark themes.
name = "channel_window"
harness = false

[[test]]
# Native Windows video upload/eviction contract, synthetic pixels only; run by the explicit VM console helper.
name = "native_video"
harness = false

[[test]]
# The calendar toolbar at desktop widths, in the private Linux sandbox with synthetic data.
name = "calendar_window"
harness = false

[[test]]
# Account-free Windows shell notifications, tray and taskbar integration in the VM console.
name = "native_desktop"
harness = false

[[test]]
# Real GPUI Desktop over two synthetic accounts, with native tray and taskbar in the VM console.
name = "native_shell"
harness = false
