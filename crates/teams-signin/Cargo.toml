[package]
name = "teams-signin"
description = "Microsoft sign-in behind a shared request guard and egress proxy, using WPE WebKit on Linux, WebView2 on Windows and WKWebView on macOS"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
# the engine's events, and the asks of a sign-in running off GPUI's foreground (`window::Windows`)
async-channel.workspace = true
# the window: GPUI's Linux platform, Wayland only (the app's own, in the personal build)
gpui-pre.workspace = true
gpui-pre-platform.workspace = true
log.workspace = true
# the in-process request/answer, the redirect URI and the code as a secret
teams-auth.workspace = true
# diagnostic decision records, installed by the app
teams-log.workspace = true
# shared credential-safe URL shape for guard diagnostics
teams-proto.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
# the guard's wire protocol
teams-signin-protocol.workspace = true
# the private directory for the guard's socket and the module
tempfile.workspace = true
# the personal window's host bound refusing a host
thiserror.workspace = true
url.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
# Linux offscreen page worker and system/pinned WebKit runtime.
teams-wpe-client.workspace = true
teams-web-engine.workspace = true

[target.'cfg(windows)'.dependencies]
teams-platform.workspace = true
webview2-com.workspace = true
windows-sys = { workspace = true, features = ["Win32_Storage_FileSystem"] }
windows = { workspace = true, features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi"] }
wry.workspace = true
raw-window-handle.workspace = true

# the macOS worker's window and page: AppKit and WebKit through objc2 (the versions GPUI and the tree already link)
[target.'cfg(target_os = "macos")'.dependencies]
block2.workspace = true
objc2.workspace = true
objc2-app-kit.workspace = true
objc2-foundation.workspace = true
objc2-web-kit.workspace = true

[[bin]]
name = "ngteams-webview"
path = "src/bin/ngteams-webview.rs"

[target.'cfg(windows)'.dev-dependencies]
rcgen.workspace = true
tokio-rustls.workspace = true
windows-core.workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
# Retained Linux offscreen engine and compositor tests.
teams-signin-extension.workspace = true
teams-wpe.workspace = true
ui-sandbox.workspace = true

[dev-dependencies]
# the window tests serve as their own worker, and drive the extension's client
gpui-pre = { workspace = true, features = ["test-support"] }
serde_json.workspace = true
# the window test stands a local endpoint in for Entra; ngteams refuses test-support builds
teams-signin = { path = ".", features = ["test-support"] }

[features]
# offline test rules and loopback window; ngteams refuses a build with them
test-support = []

[[test]]
# the sign-in engine's download window, drawn in the UI sandbox: its own `main`, for GPUI's main thread
name = "engine_wait"
harness = false

[[test]]
# the window in the UI sandbox, on a local fake sign-in page: its own `main` (GPUI runs on the main thread, and the
# page's engine is this executable run again as its worker), which runs itself again inside the sandbox
name = "window"
harness = false

[build-dependencies]
embed-resource.workspace = true

[lints]
workspace = true

[[test]]
name = "native_window"
harness = false

[[test]]
name = "native_protocol"
harness = false
