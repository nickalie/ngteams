[package]
name = "proto-lab"
description = "Protocol lab harness: lab browser profiles, captures and scenarios"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
# reads the claims of the bearer tokens the lab page sends (its identity), never the tokens themselves; decodes base64
# bodies and frames in captures for the sanitizer
base64.workspace = true
clap.workspace = true
fixture-guard.workspace = true
flate2.workspace = true
futures-util.workspace = true
# recorded request paths are decoded as protocol segments
percent-encoding.workspace = true
psl.workspace = true
regex.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
# `proto-lab auth`: PKCE, the code exchange and refresh, the skypetoken, kept in Secret Service on Linux, Credential
# Manager on Windows or the lab keychain on macOS
teams-auth.workspace = true
teams-platform.workspace = true
# Shared pure identity/conversation parsing; no runtime lab policy.
teams-proto.workspace = true
# a token's expiry as an HTTP date in `proto-lab auth`'s report
httpdate.workspace = true
# `proto-lab auth`: each region save stages in a file of its own before the rename
tempfile.workspace = true
thiserror.workspace = true
toml.workspace = true
toml_edit.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "process", "rt", "signal", "sync", "time"] }
tokio-tungstenite.workspace = true
url.workspace = true
zip.workspace = true
zeroize.workspace = true

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_Threading"] }

[dev-dependencies]
# The harness mock origins are enabled only for its tests; normal binaries refuse this build.
proto-lab = { path = ".", features = ["test-support"] }
teams-proto = { workspace = true, features = ["test-support"] }
# a local HTTPS server: Chrome uploads Reporting API reports only over a secure connection
rcgen.workspace = true
# a local websocket server for the CDP client tests
tokio = { workspace = true, features = ["net"] }
tokio-rustls.workspace = true
wiremock.workspace = true

[features]
# Test-only mock origins; the binary refuses a build with this feature.
test-support = []
# builds the live lab tests (`tests/auth_live.rs`); they still run only with PROTO_LAB_LIVE=1, so `--all-features`
# stays offline
live = []

[[test]]
name = "auth_live"
required-features = ["live"]

[lints]
workspace = true
