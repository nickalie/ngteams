[package]
name = "teams-mock"
description = "A local chat service for tests, built from the synthetic chat fixtures; clients reach it only through the test-support mock origin. A dev-dependency only, never in a lab binary"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[features]
# The loopback media peer (`media.rs`): a `teams-media` session behind a loopback TURN server, answering and offering
# in Teams' dialect, for the crates whose tests carry a call's media; the others don't build or link it.
media = ["dep:teams-media", "dep:thiserror"]

[dependencies]
# an incoming call's invitation carries its payload (`gp`) as base64 JSON
base64.workspace = true
# a call controller's deliveries are gzip'd (in base64)
flate2.workspace = true
# the Trouter mock's socket halves
futures-util.workspace = true
# the made-up app tile it serves on the CDN's path (`team_apps.rs`), drawn when asked
image = { workspace = true, features = ["png"] }
# decodes the conversation and message ids the clients percent-encode as one path segment
percent-encoding.workspace = true
serde_json.workspace = true
teams-auth.workspace = true
# the loopback media peer (`media`): a session on the file backend through the loopback TURN server
teams-media = { workspace = true, features = ["test-support"], optional = true }
thiserror = { workspace = true, optional = true }
# the Trouter mock: its own loopback server on a thread of its own, and the wake-up when an event is queued; the
# front's relay (`front.rs`) reads and writes its connections
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tokio-tungstenite.workspace = true
# the local HTTP server: one catch-all responder over the mock's state, with the requests it got recorded
wiremock.workspace = true

[dev-dependencies]
# its own media peer's test (`tests/media.rs`) and the native session it is the far end of
teams-media = { workspace = true, features = ["test-support"] }
teams-mock = { path = ".", features = ["media"] }
# the media peer's test records each side's audio into a directory of its own
tempfile.workspace = true
# the mock's own tests send raw requests too: a missing header, a malformed body
reqwest.workspace = true
# and the native transport reaching the mock through its mock origin
teams-proto = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["macros", "rt"] }
# the test that keeps the mock out of every crate's normal dependencies reads the manifests
toml.workspace = true

[lints]
workspace = true
