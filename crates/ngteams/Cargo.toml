[package]
name = "ngteams"
description = "The native Teams client for Linux"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
# the app, its sign-in window included (teams-signin's window bound to Entra's and the identity provider's hosts); that
# window's page engine is the sibling `ngteams-web` worker
name = "ngteams"
path = "src/main.rs"

[dependencies]
# the control socket's requests, from its connections' threads to GPUI's foreground
async-channel.workspace = true
clap.workspace = true
# the app's window: GPUI's Linux platform, Wayland only
gpui-pre.workspace = true
gpui-pre-platform.workspace = true
# the app's own lines in its diagnostic log; capped at `debug` at compile time like teams-trouter's
log = { workspace = true, features = ["max_level_debug", "release_max_level_debug"] }
# the sign-in (the window's protocol, the code exchange, authz and the region), the session, the Secret Service
teams-auth.workspace = true
# the read-only mode's descriptors (the broker's socket, the view trace): whether one handed in is open
libc.workspace = true
# ... a Unix stream socket, or open for writing; both made close-on-exec
rustix = { workspace = true, features = ["event", "fs", "net"] }
# the account's engine, assembled as every binary builds one (`teams_core::account`)
teams-core.workspace = true
# the diagnostic log, installed once before the engine starts
teams-log.workspace = true
# Native private account files and snapshots.
teams-platform.workspace = true
# the calls' devices: the caller selects desktop or sandbox PipeWire at run time
teams-media.workspace = true
# the echo service's MRI the test call goes to (`TEAMS_ECHO_BOT_MRI`, from the web bundle)
teams-proto.workspace = true
# the host-gated sign-in window, used in-process
teams-signin.workspace = true
# `ngteams --forget` takes the account's engine lock before it deletes anything
teams-store.workspace = true
# the views and the bridge over the engine
teams-ui.workspace = true
# `ngteamsctl`'s control socket: its protocol, socket paths and line codec, served by `ngteams::ctl`
teams-ctl.workspace = true
serde = { workspace = true, features = ["derive"] }
toml.workspace = true
thiserror.workspace = true
# the sign-in's and the engine's runtimes; the session's sign-out watch; the read-only mode's broker socket (`net`)
tokio = { workspace = true, features = ["net", "rt", "sync"] }
# the installed app's updates from its GitHub releases (`ngteams::update`)
teams-update.workspace = true
# the read-only mode opens its window only on the UI sandbox's compositor (`ui_sandbox::in_sandbox`)
[target.'cfg(target_os = "linux")'.dependencies]
# Linux page-worker client and the system/pinned runtime used by `--install-web-engine`.
teams-wpe-client.workspace = true
teams-web-engine.workspace = true
ui-sandbox.workspace = true

# macOS: the app's run ended through AppKit (`run_end`)
[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-app-kit.workspace = true
objc2-foundation.workspace = true

[target.'cfg(windows)'.dependencies]
interprocess.workspace = true
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Globalization", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Pipes", "Wdk_Foundation", "Win32_System_WindowsProgramming"] }

[dev-dependencies]
# The retained sandbox window tests read screenshots and serve mock tray items.
image = { workspace = true, features = ["png", "gif"] }
zbus.workspace = true
# a call's id for the call events the personal app's models are shown (`CallId::for_tests`)
teams-call = { workspace = true, features = ["test-support"] }
# the calls on the mock relay through its loopback TURN server (`Relay::Fixed`)
teams-core = { workspace = true, features = ["test-support"] }
base64.workspace = true
# `ngteamsctl`'s own command line, run in-process against the app's socket (`tests/activity_window.rs`)
clap.workspace = true
# a stored meeting's start written as the calendar service writes it (`tests/ctl_events.rs`)
chrono.workspace = true
gpui-pre = { workspace = true, features = ["test-support"] }
serde_json.workspace = true
tempfile.workspace = true
# the calls' media in the tests: file devices and the loopback relay; PipeWire tests select sandbox reach
teams-media = { workspace = true, features = ["test-support"] }
# the mock's calling service with its media: a loopback TURN server and a peer behind each party it plays
teams-mock = { workspace = true, features = ["media"] }
teams-proto = { workspace = true, features = ["test-support"] }
teams-trouter = { workspace = true, features = ["test-support"] }
# where a chat view drew each sender's face, for the UI tour's profile cards (`ChatView::face_bounds`)
teams-ui = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "time"] }
wiremock.workspace = true


[target.'cfg(unix)'.dev-dependencies]
# the updates' flow against a local fake release feed (`tests/support/update.rs`)
teams-update = { workspace = true, features = ["test-support"] }
[[test]]
name = "window"
harness = false

[[test]]
name = "accounts_window"
harness = false

[[test]]
name = "call_window"
harness = false

[[test]]
name = "deferred_devices_window"
harness = false

[[test]]
name = "ui_tour"
harness = false

[[test]]
name = "large_call_window"
harness = false

[[test]]
name = "share_window"
harness = false

[[test]]
name = "reactors_window"
harness = false

[[test]]
name = "first_load_window"
harness = false

[[test]]
name = "blocked_window"
harness = false

[[test]]
name = "activity_window"
harness = false

[[test]]
name = "translate_draft_window"
harness = false

[build-dependencies]
embed-resource.workspace = true

[lints]
workspace = true
