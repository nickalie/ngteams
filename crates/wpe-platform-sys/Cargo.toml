[package]
name = "wpe-platform-sys"
description = "Raw gir bindings to WPE WebKit's WPEPlatform API (WPEPlatform-2.0), taken from ngterm (MIT)"
build = "build.rs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license = "MIT"

[package.metadata.system-deps.wpe_platform_2_0]
name = "wpe-platform-2.0"
version = "2.54"

[target.'cfg(target_os = "linux")'.dependencies]
libc.workspace = true
glib-sys.workspace = true
gobject-sys.workspace = true
gio-sys.workspace = true

[build-dependencies]
system-deps.workspace = true

# Generated by gir and kept as generated: no `[lints] workspace = true` (the bindings set their own lint levels;
# scripts/lint-report.sh lists the crate in EXEMPT_CRATES). Their safe wrapper, `teams-wpe`, is under every lint.
