[package]
name = "teams-signin-extension"
description = "The sign-in window's WPE WebKit web process extension: hands every request a page sends to teams-signin's guard and drops it unless the guard allows it"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
build = "build.rs"

[lib]
# `cdylib`: the module WebKit loads into every web process; `rlib`: for `teams-wpe`, whose worker build builds the
# module too, and the tests
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_os = "linux")'.dependencies]
teams-signin-protocol.workspace = true
# `g_variant_*` (the initialization data) and `g_signal_connect_data` (`page-created`, `send-request`): hand FFI on
# the -sys crates, since no Rust binding has WebKit's web process extension API
glib-sys.workspace = true
gobject-sys.workspace = true

[build-dependencies]
# where WPE WebKit's library is (`wpe-web-process-extension-2.0`, through pkg-config)
pkg-config.workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
# Drive the actual module in WebKit using the sign-in window's existing offline sandbox scenarios.
gpui-pre.workspace = true
gpui-pre-platform.workspace = true
serde_json.workspace = true
teams-auth.workspace = true
teams-log.workspace = true
teams-signin = { workspace = true, features = ["test-support"] }
teams-wpe.workspace = true
teams-wpe-client.workspace = true
tempfile.workspace = true
ui-sandbox.workspace = true

[[test]]
# Share the real engine harness: the extension's callbacks cannot be driven by a socket peer alone.
name = "window"
path = "../teams-signin/tests/window.rs"
harness = false

[lints]
workspace = true
