[package]
name = "teams-auth"
description = "Native Teams sign-in: PKCE code exchange, token refresh and storage, skypetoken"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
base64.workspace = true
getrandom.workspace = true
httpdate.workspace = true
# session outcomes and credential-redacted HTTP exchanges in the app's diagnostic log
log.workspace = true
reqwest.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
# full token/authz HTTP exchanges at debug, with credential redaction owned by the logger
teams-log.workspace = true
# the session: one refresh per audience however many callers wait on it, and its renewal notifications; the broker:
# its server reads and writes any async stream (`io-util`) and watches it close while a store call waits (`macros`),
# its client's blocking socket runs on the blocking pool (`rt`)
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "sync"] }
# form encoding of the token requests and of the authorize URL's query
url.workspace = true
zeroize.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
oo7.workspace = true

# the macOS Keychain's generic password items (the version rustls-platform-verifier already links there)
[target.'cfg(target_os = "macos")'.dependencies]
security-framework.workspace = true

[target.'cfg(windows)'.dependencies]
interprocess = { workspace = true, features = ["tokio"] }
keyring-core.workspace = true
teams-platform.workspace = true
widestring.workspace = true
windows-native-keyring-store.workspace = true

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Pipes", "Wdk_Foundation", "Win32_System_WindowsProgramming"] }

[target.'cfg(unix)'.dev-dependencies]
libc.workspace = true
rustix = { workspace = true, features = ["fs", "net"] }

[dev-dependencies]
# the region record read back from a file
tempfile.workspace = true
# the broker's tests: its server on a socket pair's end, a deadline on its end (`time`)
tokio = { workspace = true, features = ["macros", "net", "rt", "time"] }
wiremock.workspace = true

[lints]
workspace = true
