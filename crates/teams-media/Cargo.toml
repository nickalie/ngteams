[package]
name = "teams-media"
description = "A call's media: Teams' SDP dialect (sdp-ngc-1.0) to and from libwebrtc's SDP, the relayed libwebrtc peer and its session (the microphone through the audio processing to libwebrtc, libwebrtc's audio to the speaker, the camera and the received video), a group call's control plane, the device seam (file, PipeWire and native Windows backends), and the player of a video a message carries (GStreamer's playbin fed by the engine)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[features]
# Tests only, through dev-dependencies: a minimal TURN server on loopback (`test_turn`), for this crate's tests, the
# mock's media and the engine's call tests, and the signals the audio processing is judged with (`test_signal`).
test-support = ["dep:crc32fast", "dep:hmac", "dep:md-5", "dep:sha1"]

[dependencies]
# the test TURN server's STUN codec (`test-support`): FINGERPRINT (CRC-32), MESSAGE-INTEGRITY (HMAC-SHA1 over the
# long-term key MD5(username:realm:password))
crc32fast = { workspace = true, optional = true }
hmac = { workspace = true, optional = true }
md-5 = { workspace = true, optional = true }
sha1 = { workspace = true, optional = true }
# libwebrtc's answers (SDP, a description applied) are futures: run on the asking thread
futures-executor.workspace = true
futures-util.workspace = true
# STUN transaction ids (the test TURN server) and the data line's SSRC
getrandom.workspace = true
# the camera's background effects: a picture (the app's own JPEGs, or the user's JPEG or PNG) decoded and scaled, and
# a user's picture written as a JPEG: the version and decoders GPUI already links
image = { workspace = true, features = ["png", "jpeg", "gif", "webp"] }
# a shared video file played in its card: GStreamer's playbin, fed by an appsrc, its frames and sound to appsinks;
# a sound the user imports, MP3 or Ogg, decoded (`sound_file`)
gstreamer.workspace = true
gstreamer-app.workspace = true
# the call's media: the peer connection (ICE through Teams' relay, DTLS-SRTP, Opus and H.264, the jitter buffer,
# bandwidth estimation, A/V sync), the audio processing module, the data channel
libwebrtc.workspace = true
log.workspace = true
# a group call's control plane: its messages are JSON (`mcp`)
serde_json.workspace = true
thiserror.workspace = true
# the camera's background effects: the person segmentation model (ONNX), run on the CPU
tract-onnx.workspace = true
# ... and on the GPU where there is one: the model as Burn code (generated by the build script) on Burn's wgpu
# backend, the adapter chosen through CubeCL
burn.workspace = true
burn-store.workspace = true
cubecl.workspace = true
# libwebrtc's video source keeps its track alive on a tokio task until the camera's first frame, and the media's
# threads wait for libwebrtc's streams with a timeout: the media's own runtime runs both
tokio = { workspace = true, features = ["rt-multi-thread", "time", "sync"] }
teams-platform.workspace = true

# The model's GPU API: Vulkan where the drivers have it, Metal on macOS
[target.'cfg(not(target_os = "macos"))'.dependencies]
burn = { workspace = true, features = ["vulkan"] }

[target.'cfg(target_os = "macos")'.dependencies]
burn = { workspace = true, features = ["metal"] }

[target.'cfg(windows)'.dependencies]
windows-capture.workspace = true
windows-sys = { workspace = true, features = ["Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc.workspace = true
pipewire.workspace = true
# the personal build's camera: the desktop's camera portal, asked on the bus the backend is given (blocking calls, on
# the blocking pool a device opens on; the async-io flavour the app's notifications use, so one zbus in the tree)
zbus.workspace = true

[build-dependencies]
# the person segmentation model (assets/segmentation, ONNX) as Burn code and weights, for the GPU (build.rs)
burn-onnx.workspace = true

[dev-dependencies]
# this crate's own tests run against the loopback TURN server; device tests select sandbox reach explicitly
teams-media = { workspace = true, features = ["test-support"] }
tempfile.workspace = true

[lints]
workspace = true
