[package]
name = "teams-wpe"
description = "WPE WebKit offscreen, taken from ngterm's ngterm-wpe (MIT): web views on an engine of their own (in process or in a worker process), frames out as SHM pixels or dmabufs, input in"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license = "MIT"

[[bin]]
# the only binary that links WebKit: the app runs it for the sign-in window's page
name = "ngteams-web"
path = "src/bin/ngteams-web.rs"

[target.'cfg(target_os = "linux")'.dependencies]
teams-wpe-client.workspace = true
# built with the worker: the module WebKit loads into the sign-in window's web processes
teams-signin-extension.workspace = true
wpe-webkit-sys.workspace = true
wpe-platform-sys.workspace = true
wpe-javascriptcore-sys.workspace = true
async-channel.workspace = true
gio.workspace = true
glib.workspace = true
libc.workspace = true
log.workspace = true
# the worker's transport (`worker`): a SOCK_SEQPACKET pair, descriptors passed with SCM_RIGHTS, sealed memfds, polls
rustix = { workspace = true, features = ["event", "fs", "net"] }
serde_json.workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
tempfile.workspace = true
ui-sandbox.workspace = true

[[test]]
# Own main: it reexecutes itself inside the UI sandbox and serves native workers before any other work.
name = "engine"
harness = false

[lints]
workspace = true
