[package]
name = "teams-core"
description = "The native client's core: an engine on its own runtime, reached through channels; commands go out through the outbox, push deliveries and a catch-up sync keep the store up to date"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[features]
# Tests only, through dev-dependencies: a call's media relayed through given servers (a test's loopback TURN server,
# `Relay::Fixed`) instead of Teams' relay. It also turns on teams-proto's test support, so ngteams refuses to run
# (`teams_proto::test_support_enabled`).
test-support = ["teams-proto/test-support"]

[dependencies]
# a calendar event's time without an offset placed in the desktop's time zone, as the calendar view places it
chrono.workspace = true
# The calendar service expects an IANA zone; Windows does not have /etc/localtime.
iana-time-zone.workspace = true
# a fresh `clientmessageid` for each command, from the system random source
getrandom.workspace = true
# a lab engine's warning that the region's middle-tier base was refused (never its value); capped at `debug` at compile
# time like teams-trouter's
log = { workspace = true, features = ["max_level_debug", "release_max_level_debug"] }
# a meeting item's details link carries its event's id percent-encoded
percent-encoding.workspace = true
serde.workspace = true
# a command's outbox payload, and a message post's answer (`OriginalArrivalTime`)
serde_json.workspace = true
# a throttled token (`TokenError::Throttled`) waits like a throttled post; the account engine's session
teams-auth.workspace = true
# a call's signaling machine (M3 Task 14): it builds the call writes, the engine sends them through the outbox
teams-call.workspace = true
# a call's media: the relay, the session on the devices, Teams' SDP dialect
teams-media.workspace = true
teams-proto.workspace = true
teams-store.workspace = true
# the push channel the engine runs and takes its deliveries from
teams-trouter.workspace = true
thiserror.workspace = true
# the engine's own runtime (current-thread, on a thread of its own) and its channels
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }

[dev-dependencies]
# Synthetic actor/audience credentials for native caption integration tests.
base64.workspace = true
# the call session's tests relay through the mock's loopback TURN server
teams-core = { path = ".", features = ["test-support"] }
# and run on the file backend
teams-media = { workspace = true, features = ["test-support"] }
# the sync tests write as the other lab accounts straight to the mock chat service
reqwest.workspace = true
# the sync tests' chat service, from the synthetic fixtures; with its calling service's media (a loopback peer behind
# the parties it plays) for the call session's tests
teams-mock = { workspace = true, features = ["media"] }
# the diagnostic log at `info` and at `debug` over an offline run (`tests/diagnostic_log.rs`, `tests/diagnostic_log_debug.rs`)
teams-log.workspace = true
# the transport reaches wiremock through its mock origin
teams-proto = { workspace = true, features = ["test-support"] }
# the engine tests' push channel reaches the Trouter mock through its mock origin
teams-trouter = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
# a post's ISO compose time read back, to compare with the row's
time.workspace = true
# the call tests run on two workers: the mock's media (its peers' and mixers' libwebrtc offers and answers) blocks
# the handler that makes it, and the mock's sockets answer pings meanwhile
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "time"] }
wiremock.workspace = true

[lints]
workspace = true
