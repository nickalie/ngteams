[package]
name = "ngteams-server"
description = "The own Teams-compatible server ngteams can sign in to instead of Microsoft's: its authentication and native chat endpoints, database, fan-out and storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "ngteams-server"
path = "src/main.rs"

[dependencies]
ammonia.workspace = true
argon2.workspace = true
async-trait.workspace = true
aws-lc-rs.workspace = true
axum.workspace = true
axum-server.workspace = true
base64.workspace = true
bytes.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
clap = { workspace = true, features = ["env"] }
diesel.workspace = true
diesel-async.workspace = true
diesel_migrations.workspace = true
ego-tree.workspace = true
figment.workspace = true
flate2.workspace = true
futures-util.workspace = true
governor.workspace = true
http-range-header.workspace = true
hyper.workspace = true
hyper-util.workspace = true
image = { workspace = true, features = ["png", "jpeg", "gif", "webp"] }
indexmap.workspace = true
ipnet.workspace = true
# `use_pem`: an RSA key in PKCS#8, as aws-lc-rs makes it, is read only from PEM (the bot signing keys)
jsonwebtoken = { workspace = true, features = ["use_pem"] }
libsqlite3-sys.workspace = true
mime_guess.workspace = true
oauth2.workspace = true
object_store.workspace = true
opus.workspace = true
percent-encoding.workspace = true
pulldown-cmark.workspace = true
redis.workspace = true
reqwest.workspace = true
rrule.workspace = true
rustls.workspace = true
# source attribute order when a message is written out again (`chatsvc::rich`)
scraper = { workspace = true, features = ["deterministic"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
str0m.workspace = true
teams-sdp.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite.workspace = true
tower.workspace = true
tower-http.workspace = true
tower_governor.workspace = true
tracing = { workspace = true, features = ["std", "attributes"] }
tracing-subscriber.workspace = true
unicode-normalization.workspace = true
url = { workspace = true, features = ["serde"] }
uuid.workspace = true
# Teams app packages
zip.workspace = true

[dev-dependencies]
image = { workspace = true, features = ["png"] }
# the e2e tests: the real client crates against the in-process server
rcgen = { workspace = true, features = ["pem"] }
reqwest = { workspace = true, features = ["form", "json"] }
teams-auth.workspace = true
# the calls' e2e tests: the client's call machine on the server's signaling, and its engine's calls with their media
# on the file device backend through the loopback TURN server
teams-call.workspace = true
teams-core = { workspace = true, features = ["calls", "test-support"] }
teams-media = { workspace = true, features = ["test-support"] }
teams-proto = { workspace = true, features = ["test-support"] }
teams-store.workspace = true
# the per-account calls' e2e test: Microsoft accounts on the mock beside an own-server account
teams-mock.workspace = true
# the push channel's e2e tests: the client's own Trouter session, and a bare socket for what that session never sends
teams-trouter = { workspace = true, features = ["test-support"] }
tempfile.workspace = true

[lints]
workspace = true
