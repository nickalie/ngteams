name: Coverage environment
description: Cached Arch image and CPU-only browser sandbox on a disposable hosted VM
inputs:
  save-cache:
    description: Export the shared image cache from the build job only
    default: 'false'
outputs:
  image-id:
    description: Actual image identity, including the native system libraries
    value: ${{ steps.build.outputs.imageid }}
runs:
  using: composite
  steps:
    - name: Free space for instrumented native test binaries
      shell: bash
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache \
          /usr/local/share/boost /usr/local/share/powershell /usr/local/share/chromium /usr/share/swift \
          /usr/lib/jvm /usr/local/julia* /opt/az /opt/microsoft /opt/google
        docker system prune --all --force
        df -h /
    - name: Allow browser sandbox namespaces on this disposable VM
      shell: bash
      run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
    - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
    - name: Image build arguments
      id: image
      shell: bash
      run: |
        echo "rust=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')" >> "$GITHUB_OUTPUT"
        echo "uid=$(id -u)" >> "$GITHUB_OUTPUT"
    - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
      id: build
      with:
        context: .github/ci
        load: true
        tags: ngteams-coverage
        build-args: |
          RUST_VERSION=${{ steps.image.outputs.rust }}
          CI_UID=${{ steps.image.outputs.uid }}
        cache-from: type=gha,scope=coverage-image-v1
        cache-to: ${{ inputs.save-cache == 'true' && 'type=gha,mode=min,scope=coverage-image-v1,ignore-error=true' || '' }}
