name: Coverage environment
description: Cached Arch image and CPU-only browser sandbox on a disposable hosted VM
inputs:
  save-cache:
    description: Export the shared image cache from the build job only
    default: 'false'
  disk:
    description: Test shards extract only their targets; build and report jobs need more disk
    default: full
outputs:
  image-id:
    description: Actual image identity, including the native system libraries
    value: ${{ steps.build.outputs.imageid }}
runs:
  using: composite
  steps:
    - name: Free space for instrumented native test binaries
      shell: bash
      env:
        DISK_MODE: ${{ inputs.disk }}
      # The removal takes about three minutes: it runs while the image builds, and the last step waits for it. A shard
      # skips it when the runner has enough free space; the build and report jobs use more than 86 GiB.
      run: |
        available=$(df --output=avail -BG / | tail -1 | tr -dc 0-9)
        if [[ "$DISK_MODE" == tests ]] && ((available >= 40)); then
          echo "${available} GiB free: no cleanup"
          echo 0 > "$RUNNER_TEMP/coverage-disk-freed"
          exit 0
        fi
        # before the image build: it removes unused images only
        docker system prune --all --force
        paths=(/usr/share/dotnet /usr/local/lib/android)
        if [[ "$DISK_MODE" == full ]]; then
          paths+=(/opt/ghc /usr/local/.ghcup /opt/hostedtoolcache \
            /usr/local/share/boost /usr/local/share/powershell /usr/local/share/chromium /usr/share/swift \
            /usr/lib/jvm /usr/local/julia* /opt/az /opt/microsoft /opt/google)
        fi
        nohup bash -c 'sudo rm -rf "$@"; echo $? > "$RUNNER_TEMP/coverage-disk-freed"' cleanup "${paths[@]}" \
          > /dev/null 2>&1 &
    - name: Allow browser sandbox namespaces on this disposable VM
      shell: bash
      run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
    - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
    - name: Image build arguments
      id: image
      shell: bash
      run: |
        echo "rust=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')" >> "$GITHUB_OUTPUT"
        echo "uid=$(id -u)" >> "$GITHUB_OUTPUT"
    - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
      id: build
      with:
        context: .github/ci
        load: true
        tags: ngteams-coverage
        build-args: |
          RUST_VERSION=${{ steps.image.outputs.rust }}
          CI_UID=${{ steps.image.outputs.uid }}
        cache-from: type=gha,scope=coverage-image-v1
        cache-to: ${{ inputs.save-cache == 'true' && 'type=gha,mode=min,scope=coverage-image-v1,ignore-error=true' || '' }}
    - name: Wait for the disk cleanup
      shell: bash
      run: |
        for _ in $(seq 600); do
          if [[ -f "$RUNNER_TEMP/coverage-disk-freed" ]]; then
            df -h /
            exit "$(cat "$RUNNER_TEMP/coverage-disk-freed")"
          fi
          sleep 1
        done
        echo "the disk cleanup did not end in 10 minutes" >&2
        exit 1
