name: Fixture and documentation guard

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - '**/tests/fixtures/**'
      - crates/fixture-guard/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - .cargo/**
      - .github/workflows/fixtures.yml
  pull_request:
    paths:
      - docs/**
      - '**/tests/fixtures/**'
      - crates/fixture-guard/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - .cargo/**
      - .github/workflows/fixtures.yml
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fixtures-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fixtures:
    name: Fixture and documentation guard
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check synthetic markers and scan fixtures and docs for secrets
        run: cargo test --locked -p fixture-guard
