name: Coverage

on:
  push:
    branches: [main]
    paths:
      - '**'
      - '!**/*.md'
      - '!docs/**'
      # These Markdown files are build/test inputs; docs/ is checked by fixtures.yml.
      - '**/tests/fixtures/**'
      - vendor/gpui-pre/README.md
  pull_request:
    paths:
      - '**'
      - '!**/*.md'
      - '!docs/**'
      - '**/tests/fixtures/**'
      - vendor/gpui-pre/README.md
  merge_group:
  workflow_dispatch:
  # the release workflow runs this whole suite and publishes only if it passes
  workflow_call:

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate-tests:
    name: Coverage gate tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: ELF tools for the packaging script tests
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends patchelf zstd
      - name: LLVM's PE reader for the Windows media closure tests
        # rust-toolchain.toml selects the pinned toolchain; its llvm-readobj reads the PE fixtures.
        run: rustup component add llvm-tools-preview
      - name: Script tests (coverage reporter, lab runner, packaging)
        run: python3 -B -m unittest discover -s scripts -p 'test_*.py'

  coverage:
    name: Coverage ≥90%
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Free space for instrumented native test binaries
        # The instrumented test binaries outgrew what the smaller list left: the linker died on a full disk.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache \
            /usr/local/share/boost /usr/local/share/powershell /usr/local/share/chromium /usr/share/swift \
            /usr/lib/jvm /usr/local/julia* /opt/az /opt/microsoft /opt/google
          docker system prune --all --force
          df -h /
      - name: Allow browser sandbox namespaces on this disposable VM
        # Ubuntu's host policy applies inside privileged containers too. Browser sandboxes stay enabled.
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Build the native test environment with software graphics
        run: |
          rust_version=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          docker build --build-arg "RUST_VERSION=$rust_version" --build-arg "CI_UID=$(id -u)" \
            --tag ngteams-coverage .github/ci
      - name: Require 90% lines, functions and regions in every runtime crate
        id: measurement
        # WebKit creates its own sandbox namespaces. This privileged container runs only on a disposable hosted VM.
        run: |
          docker run --rm --init --privileged --shm-size=2g \
            --tmpfs /dev/dri:rw,nosuid,nodev,noexec,size=1m \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            ngteams-coverage
      - name: Show measured coverage
        if: always()
        env:
          COVERAGE_TEST_OUTCOME: ${{ steps.measurement.outcome }}
        run: python3 .github/ci/summary.py >> "$GITHUB_STEP_SUMMARY"
      - name: Save coverage summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-summary
          path: target/coverage/continuous/all/summary.json
          if-no-files-found: warn
          retention-days: 14
