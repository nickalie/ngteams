name: Coverage

on:
  push:
    branches: [main]
    paths:
      - '**'
      - '!**/*.md'
      - '!docs/**'
      # These Markdown files are build/test inputs; docs/ is checked by fixtures.yml.
      - '**/tests/fixtures/**'
      - vendor/gpui-pre/README.md
  pull_request:
    paths:
      - '**'
      - '!**/*.md'
      - '!docs/**'
      - '**/tests/fixtures/**'
      - vendor/gpui-pre/README.md
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

# A pull request's newer push replaces its older run. Pushes to main, merge-queue entries and manual runs are keyed
# by ref and commit: the release waits for the Coverage run of its exact commit, so neither a later push nor a run
# of the same commit on another branch may cancel that run.
concurrency:
  group: coverage-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: true

jobs:
  gate-tests:
    name: Coverage gate tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: ELF tools for the packaging script tests
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends patchelf zstd
      - name: LLVM's PE reader for the Windows media closure tests
        # rust-toolchain.toml selects the pinned toolchain; its llvm-readobj reads the PE fixtures.
        run: rustup component add llvm-tools-preview
      - name: Script tests (coverage reporter, lab runner, packaging)
        run: python3 -B -m unittest discover -s scripts -p 'test_*.py'

  build:
    name: Build instrumented tests
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/coverage-env
        id: environment
        with:
          save-cache: 'true'
      - name: Restore registry and Git sources
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .ci-cache/registry
            .ci-cache/git
          key: coverage-sources-v1-${{ hashFiles('Cargo.lock') }}
          restore-keys: coverage-sources-v1-
      - name: Restore pinned libwebrtc SDK
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .ci-cache/webrtc
          key: coverage-webrtc-linux-x64-v1-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '.github/ci/Dockerfile') }}
      - name: Restore instrumented dependencies
        id: dependencies
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .ci-cache/build
          key: coverage-build-v1-${{ steps.environment.outputs.image-id }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '.github/ci/**', '!.github/ci/test-times.json', '.cargo/**', 'vendor/**') }}
      - name: Unpack compatible dependencies
        run: |
          if [[ -f .ci-cache/build/dependencies.tar.zst ]]; then
            tar -I 'zstd --long=30' -xf .ci-cache/build/dependencies.tar.zst
            rm .ci-cache/build/dependencies.tar.zst
          fi
      - name: Compile all runtime test targets and inventory the shards
        run: |
          mkdir -p target
          python3 -c 'import time; print(time.time())' > target/compile-start
          .github/ci/docker.sh build
      - name: Record dependency and workspace compiler durations
        run: |
          python3 scripts/ci-compile-times.py --target target/coverage-continuous-build \
            --started target/compile-start --output target/compile-times.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-compile-times
          path: target/compile-times.json
          retention-days: 14
          if-no-files-found: error
      - name: Bundle the shared executables and coverage maps
        run: .github/ci/bundle.sh pack
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-common
          path: target/coverage-common.tar.zst
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-shard-0
          path: target/coverage-shard-0.tar.zst
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-shard-1
          path: target/coverage-shard-1.tar.zst
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-shard-2
          path: target/coverage-shard-2.tar.zst
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-shard-3
          path: target/coverage-shard-3.tar.zst
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-shard-4
          path: target/coverage-shard-4.tar.zst
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-shard-5
          path: target/coverage-shard-5.tar.zst
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-shard-6
          path: target/coverage-shard-6.tar.zst
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-shard-7
          path: target/coverage-shard-7.tar.zst
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - name: Prepare bounded dependency cache
        id: prepared-cache
        if: steps.dependencies.outputs.cache-hit != 'true'
        run: |
          docker run --rm --entrypoint /bin/bash --volume "$GITHUB_WORKSPACE:/workspace" \
            ngteams-coverage .github/ci/bundle.sh cache
          if [[ -f .ci-cache/build/dependencies.tar.zst ]]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: steps.dependencies.outputs.cache-hit != 'true' && steps.prepared-cache.outputs.ready == 'true'
        with:
          path: .ci-cache/build
          key: ${{ steps.dependencies.outputs.cache-primary-key }}

  shards:
    name: Coverage shard ${{ matrix.shard }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    # the own server's Postgres and Redis cases (crates/ngteams-server, docs/server.md); reached from the measuring
    # container through the host gateway. Every shard has them: the balancer may assign the server's targets to any.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ngts
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/coverage-env
        with:
          disk: tests
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: coverage-shard-${{ matrix.shard }}
          path: target
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: coverage-common
          path: target
      - name: Restore dependency sources for compile-contract tests
        id: sources
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .ci-cache/registry
            .ci-cache/git
          key: coverage-sources-v1-${{ hashFiles('Cargo.lock') }}
      - name: Fetch the locked sources when the cache has none
        # The cache is best effort: an unsaved or evicted entry must not fail the offline Cargo tests.
        if: steps.sources.outputs.cache-hit != 'true'
        run: .github/ci/docker.sh fetch
      - name: Unpack shared tests
        run: |
          .github/ci/unpack.sh target
          rm target/coverage-*.tar.zst
      - name: Run every assigned target, retaining failures
        env:
          SHARD: ${{ matrix.shard }}
          NGTEAMS_SERVER_PG_URL: postgres://postgres:ngts@host.docker.internal:5432/postgres
          NGTEAMS_SERVER_REDIS_URL: redis://host.docker.internal:6379
        run: .github/ci/docker.sh test "$SHARD"
      - name: Bundle current LLVM profiles
        if: always()
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          find target/coverage-continuous-build -name '*.profraw' -print > target/profile-files
          tar -I 'zstd -T2 -3' -cf "target/profiles-$SHARD.tar.zst" -T target/profile-files
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: coverage-profiles-${{ matrix.shard }}
          path: |
            target/profiles-*.tar.zst
            target/shard-*.json
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  coverage:
    name: Coverage ≥90%
    needs: [gate-tests, build, shards]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/coverage-env
        if: needs.build.result == 'success' && !cancelled()
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: needs.build.result == 'success' && !cancelled()
        with:
          pattern: coverage-*
          path: target/coverage-inputs
          merge-multiple: true
      - name: Merge profiles and require 90% in every runtime crate
        id: measurement
        if: needs.build.result == 'success' && !cancelled()
        run: |
          .github/ci/unpack.sh target/coverage-inputs
          .github/ci/docker.sh report
      - name: Show measured coverage
        if: always()
        env:
          COVERAGE_TEST_OUTCOME: ${{ needs.shards.result == 'success' && steps.measurement.outcome == 'success' && 'success' || 'failure' }}
        run: python3 .github/ci/summary.py >> "$GITHUB_STEP_SUMMARY"
      - name: Save coverage summary and target timings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-summary
          path: |
            target/coverage/continuous/all/summary.json
            target/coverage-inputs/shard-*.json
            target/coverage-inputs/compile-times.json
            target/test-shards.json
          if-no-files-found: warn
          retention-days: 14
      - name: Require all tests and the complete measurement
        if: always()
        env:
          GATE_RESULT: ${{ needs.gate-tests.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          SHARD_RESULT: ${{ needs.shards.result }}
          MEASUREMENT_RESULT: ${{ steps.measurement.outcome }}
        run: |
          [[ "$GATE_RESULT" == success && "$BUILD_RESULT" == success && \
             "$SHARD_RESULT" == success && "$MEASUREMENT_RESULT" == success ]]
