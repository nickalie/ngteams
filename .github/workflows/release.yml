# Every push to main: build native Linux and Windows x86_64 packages (the Windows zip and its per-user installer) and
# the macOS arm64 app (ngteams.app in a zip and a dmg), and publish one GitHub release.
#
# Packages carry no web engine: the app finds WPE WebKit 2.54+ on the system or downloads a pinned runtime the first
# time it needs one. The runtime is built from ngterm's portable WPE prefix (pinned by digest, attestation-checked; WPE
# is never built here) and published once on its own `web-engine-<key>` prerelease, reused while its key is unchanged.
#
# `build` holds no write token or publish secret and uploads the finished files as an artifact. `publish` downloads
# them, writes SHA256SUMS, attests them, makes sure the runtime is published, and then creates the release. A version
# is `<workspace version>.<run number>` (0.1.0.123, tag v0.1.0.123), monotonic for deb, rpm and pacman upgrades.
name: release

on:
  push:
    branches: [main]
    # Only what ends up in a package: a push of docs, skills or CI settings builds nothing, and leaves a running release
    # alone. (GitHub also refuses this job's token a new release on a commit that changes a workflow file.)
    paths:
      - crates/**
      - '!crates/**/*.md'
      - vendor/**
      - '!vendor/**/*.md'
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - packaging/**
      - scripts/release-*
      - scripts/package-*
      - scripts/web-engine-closure.py
      - scripts/check-linux-package.py
      - scripts/lib/fetch-tool.sh
      - scripts/windows-*
      - scripts/lib/windows-runner.ps1
      - scripts/macos-gstreamer.sh
  workflow_dispatch:
    inputs:
      coverage_only:
        description: Verify same-commit Coverage reuse without building or publishing
        type: boolean
        default: false

permissions:
  contents: read

# A new push cancels whatever release is building or waiting: only the newest commit is worth publishing.
concurrency:
  group: ${{ inputs.coverage_only && format('release-coverage-{0}', github.ref) || 'release' }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    if: ${{ !inputs.coverage_only }}
    runs-on: ubuntu-24.04
    # A cold Rust release build, plus the runtime's archive when its key is new.
    timeout-minutes: 240
    # attestations: `gh attestation verify` of ngterm's WPE prefix (scripts/release-wpe-pull.sh)
    permissions:
      contents: read
      attestations: read
    env:
      NGTEAMS_RELEASE_WPE: /home/runner/.cache/ngterm/release-wpe
      NGTEAMS_BUILD_COMMIT: ${{ github.sha }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      web_engine_key: ${{ steps.runtime.outputs.key }}
      web_engine_archive: ${{ steps.runtime.outputs.archive }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Version
        id: version
        run: |
          workspace="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          version="$workspace.$GITHUB_RUN_NUMBER"
          echo "WORKSPACE_VERSION=$workspace" >> "$GITHUB_ENV"
          {
            echo "version=$version"
            echo "tag=v$version"
          } >> "$GITHUB_OUTPUT"
      - name: Build and packaging dependencies
        run: scripts/release-linux-deps.sh
      - name: Packaging script tests
        run: |
          python3 -B -m unittest discover -s scripts -p 'test_web_engine_closure.py'
          python3 -B -m unittest discover -s scripts -p 'test_check_linux_package.py'
      - name: Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release-ubuntu-24.04
      # Unpacked only once `gh attestation verify` ties it to ngterm's cache workflow on main: a failed check fails the job.
      - name: Portable WPE WebKit from GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/release-wpe-pull.sh
      # The published runtime for this key when there is one (a shipped app pins it, so it is never rebuilt), else this
      # run's. Either way it lands in dist/ and its pins reach the app's build.
      - name: Web engine runtime
        id: runtime
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          key="$(scripts/package-web-engine.sh --print-key)"
          name="ngteams-web-engine-$key-linux-x86_64.tar.zst"
          choice="$(python3 scripts/release-web-engine.py fetch "$key" dist)"
          echo "web-engine-$key: $choice"
          [[ "$choice" != upload ]] || scripts/package-web-engine.sh dist
          [[ -f "dist/$name" ]] || { echo "::error::no runtime dist/$name"; exit 1; }
          {
            echo "NGTEAMS_WEB_ENGINE_KEY=$key"
            echo "NGTEAMS_WEB_ENGINE_URL=https://github.com/$GH_REPO/releases/download/web-engine-$key/$name"
            echo "NGTEAMS_WEB_ENGINE_SIZE=$(stat -c %s "dist/$name")"
            echo "NGTEAMS_WEB_ENGINE_SHA256=$(sha256sum "dist/$name" | cut -d' ' -f1)"
            echo "WEB_ENGINE_ARCHIVE=$name"
          } >> "$GITHUB_ENV"
          {
            echo "key=$key"
            echo "archive=$name"
          } >> "$GITHUB_OUTPUT"
      - name: Clang
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "CLANG_BIN=$(scripts/release-clang.sh "$RUNNER_TEMP")" >> "$GITHUB_ENV"
      - name: Release binaries
        env:
          CC: ${{ env.CLANG_BIN }}/clang
          CXX: ${{ env.CLANG_BIN }}/clang++
          PKG_CONFIG_PATH: ${{ env.NGTEAMS_RELEASE_WPE }}/lib/pkgconfig
          LD_LIBRARY_PATH: ${{ env.NGTEAMS_RELEASE_WPE }}/lib
          TEAMS_PERSONAL_INSTALL: "1"
          # the version the app's updater compares GitHub's latest release with (crates/teams-update)
          NGTEAMS_RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          cargo build --locked --release -p ngteams -p teams-wpe --bin ngteams --bin ngteams-web
          cargo build --locked --release -p teams-ctl --bin ngteamsctl
      - name: Archive, native packages and AppImage
        env:
          # the packaging tools' API fallback (scripts/lib/fetch-tool.sh): unauthenticated calls hit the shared limit
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: scripts/package-release.sh target/release "$VERSION" dist
      - name: Unpack the archive for the smoke checks
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          work="$RUNNER_TEMP/smoke"
          mkdir -p "$work/data"
          tar -xzf "dist/ngteams-$VERSION-linux-x86_64.tar.gz" -C "$work"
          echo "SMOKE=$work" >> "$GITHUB_ENV"
      - name: Build identity, in the archive and the AppImage
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          expected="$WORKSPACE_VERSION"$'\n'"$NGTEAMS_BUILD_COMMIT"
          for app in "$SMOKE/ngteams/usr/bin/ngteams" "$SMOKE/ngteams/AppRun"; do
            identity="$("$app" --build-identity)"
            [[ "$identity" == "$expected" ]] || { echo "::error::$app is '$identity', expected '$expected'"; exit 1; }
          done
          identity="$(APPIMAGE_EXTRACT_AND_RUN=1 "dist/ngteams-$VERSION-linux-x86_64.AppImage" --build-identity)"
          [[ "$identity" == "$expected" ]] || { echo "::error::the AppImage is '$identity', expected '$expected'"; exit 1; }
          # what the updater reads: the release this tree is and how it was installed
          [[ "$(cat "$SMOKE/ngteams/usr/share/ngteams/release")" == "$VERSION" ]]
          [[ "$(cat "$SMOKE/ngteams/usr/share/ngteams/update-format")" == linux-archive ]]
      - name: Install the runtime with the packaged app
        run: |
          XDG_DATA_HOME="$SMOKE/data" "$SMOKE/ngteams/usr/bin/ngteams" --install-web-engine "dist/$WEB_ENGINE_ARCHIVE"
          manifest="$SMOKE/data/ngteams/web-engine/$NGTEAMS_WEB_ENGINE_KEY/MANIFEST"
          grep -qx "key=$NGTEAMS_WEB_ENGINE_KEY" "$manifest"
          grep -qx "arch=x86_64" "$manifest"
      # The worker on the runtime an install gets, with the build's WPE prefix out of reach so nothing falls back to it.
      - name: Probe the worker on the runtime
        run: |
          mv "$NGTEAMS_RELEASE_WPE" "$SMOKE/hidden-wpe"
          version="$(LD_LIBRARY_PATH="$SMOKE/data/ngteams/web-engine/$NGTEAMS_WEB_ENGINE_KEY/lib" "$SMOKE/ngteams/usr/bin/ngteams-web" --probe)"
          echo "$version"
          expected="$(sed -n 's/^wpe_version=//p' "$SMOKE/data/ngteams/web-engine/$NGTEAMS_WEB_ENGINE_KEY/MANIFEST")"
          [[ -n "$expected" && "$version" == "$expected" ]] || { echo "::error::the worker reported '$version', the runtime is '$expected'"; exit 1; }
      - name: Install the .deb
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          sudo apt-get install -y "./dist/ngteams_${VERSION}-1_amd64.deb"
          dpkg -s ngteams
          [[ "$(dpkg-query -W -f '${Version}' ngteams)" == "${VERSION}-1" ]]
          identity="$(/usr/bin/ngteams --build-identity)"
          [[ "$identity" == "$WORKSPACE_VERSION"$'\n'"$NGTEAMS_BUILD_COMMIT" ]] || { echo "::error::the .deb's ngteams is '$identity'"; exit 1; }
          [[ "$(cat /opt/ngteams/usr/share/ngteams/release)" == "$VERSION" ]]
          [[ "$(cat /opt/ngteams/usr/share/ngteams/update-format)" == linux-deb ]]
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        with:
          name: release-linux-x86_64
          path: dist/*
          if-no-files-found: error

  tests:
    name: Coverage commit gate
    runs-on: ubuntu-24.04
    timeout-minutes: 155
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require standalone Coverage success for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release-coverage.py

  windows:
    if: ${{ !inputs.coverage_only }}
    runs-on: windows-2025
    timeout-minutes: 240
    permissions:
      contents: read
    env:
      NGTEAMS_BUILD_COMMIT: ${{ github.sha }}
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
    defaults:
      run:
        shell: pwsh
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Version
        run: |
          $workspace = python -c "import tomllib; print(tomllib.load(open('Cargo.toml', 'rb'))['workspace']['package']['version'])"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "WORKSPACE_VERSION=$workspace" >> $env:GITHUB_ENV
          "VERSION=$workspace.$env:GITHUB_RUN_NUMBER" >> $env:GITHUB_ENV
      - name: Rust toolchain and PE inspection tools
        run: |
          rustup toolchain install
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup component add llvm-tools-preview
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release-windows-2025
      - name: Pinned native media SDK
        run: scripts/release-windows-deps.ps1
      # The installer's compiler, hash-pinned in packaging/windows/installer-pins.json, installed for this user only.
      - name: Pinned Inno Setup
        run: |
          $iscc = scripts/release-innosetup.ps1 -Destination (Join-Path $env:RUNNER_TEMP 'innosetup')
          "ISCC=$iscc" >> $env:GITHUB_ENV
      - name: Packaging contracts
        run: |
          if (!(Get-Command clang -ErrorAction SilentlyContinue)) { throw 'PE fixture compiler clang is required.' }
          python -B scripts/test_windows_media_closure.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B scripts/test_windows_release.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          scripts/test-package-release-windows.ps1
      # Only the hosted release workflow may build the install-marked client. Branch dispatches may build artifacts,
      # but publish below is main-only and requires both native jobs to succeed.
      - name: Release binaries
        env:
          TEAMS_PERSONAL_INSTALL: "1"
        run: |
          # the version the app's updater compares GitHub's latest release with (crates/teams-update)
          $env:NGTEAMS_RELEASE_VERSION = $env:VERSION
          . scripts/lib/windows-runner.ps1
          Set-NgteamsMediaEnvironment $pwd.Path
          cargo build --locked --release -p ngteams -p teams-signin --bin ngteams --bin ngteams-webview
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --locked --release -p teams-ctl --bin ngteamsctl
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # The zip and the installer, both from the same staged and checked files. Code signing: docs/ci.md.
      - name: Windows archive and installer, complete media runtime and notices
        run: scripts/package-release-windows.ps1 -Binaries target/release -Version $env:VERSION -Commit $env:NGTEAMS_BUILD_COMMIT -InnoSetup $env:ISCC
      - name: Unpack and verify the archive
        run: |
          $smoke = Join-Path $env:RUNNER_TEMP 'windows-release-smoke'
          Expand-Archive "dist/ngteams-$env:VERSION-windows-x86_64.zip" $smoke
          $package = Join-Path $smoke 'ngteams'
          python scripts/windows-release.py check $package --version $env:VERSION --commit $env:NGTEAMS_BUILD_COMMIT
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$package/Install.ps1" -VerifyOnly
          # Identity/help are display-free and touch no account or credential store. Never start a sending GUI in CI.
          # ngteams.exe is a GUI-subsystem program: PowerShell waits for it and reads its stdout only inside a
          # pipeline. A bare capture closes the pipe early and leaves a stale $LASTEXITCODE.
          $identity = @(& "$package/bin/ngteams.exe" --build-identity | Write-Output)
          if ($LASTEXITCODE -ne 0 -or $identity.Count -ne 2 -or $identity[0] -ne $env:WORKSPACE_VERSION -or $identity[1] -ne $env:NGTEAMS_BUILD_COMMIT) {
            throw 'Packaged Windows build identity mismatch.'
          }
          & "$package/bin/ngteamsctl.exe" --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "PACKAGE=$package" >> $env:GITHUB_ENV
      # Per user on this runner, as a user would; never starts the app. Its files must be the zip's, byte for byte.
      - name: Install and uninstall the installer
        run: scripts/test-windows-installer.ps1 -Installer "dist/ngteams-$env:VERSION-windows-x86_64-setup.exe" -Package $env:PACKAGE
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        with:
          name: release-windows-x86_64
          path: |
            dist/*.zip
            dist/*-setup.exe
          if-no-files-found: error

  # ngteams.app for Apple silicon, its GStreamer runtime inside. Signed with a Developer ID and notarized when the
  # repository has the signing secrets (docs/ci.md, "macOS signing"); ad hoc without them.
  macos:
    if: ${{ !inputs.coverage_only }}
    runs-on: macos-latest
    timeout-minutes: 180
    permissions:
      contents: read
    env:
      NGTEAMS_BUILD_COMMIT: ${{ github.sha }}
      CARGO_INCREMENTAL: "0"
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Version
        run: |
          workspace=$(python3 -c "import tomllib; print(tomllib.load(open('Cargo.toml', 'rb'))['workspace']['package']['version'])")
          echo "WORKSPACE_VERSION=$workspace" >> "$GITHUB_ENV"
          echo "VERSION=$workspace.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
      - name: Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release-macos
      - name: GStreamer's pinned macOS runtime
        run: |
          scripts/macos-gstreamer.sh "$RUNNER_TEMP/gstreamer"
          echo "PKG_CONFIG_PATH=$RUNNER_TEMP/gstreamer/lib/pkgconfig" >> "$GITHUB_ENV"
      - name: Release binaries
        env:
          TEAMS_PERSONAL_INSTALL: "1"
        run: |
          # the version the app's updater compares GitHub's latest release with (crates/teams-update)
          export NGTEAMS_RELEASE_VERSION="$VERSION"
          cargo build --locked --release -p ngteams -p teams-signin --bin ngteams --bin ngteams-webview
          cargo build --locked --release -p teams-ctl --bin ngteamsctl
      # The Developer ID secrets reach only this step. The keychain they go into lives through the packaging and its
      # checks, until "Remove the signing keychain" deletes it (that step runs whatever happened).
      - name: Signing keychain (only with the Developer ID secrets)
        env:
          CERTIFICATE: ${{ secrets.MACOS_DEVELOPER_ID_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_PASSWORD }}
        run: |
          if [[ -z "$CERTIFICATE" ]]; then
            echo "::notice::no Developer ID secrets: the app is signed ad hoc"
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(uuidgen)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/developer-id.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" > /dev/null
          keychains=("$keychain")
          while read -r existing_keychain; do
            keychains+=("${existing_keychain//\"/}")
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "${keychains[@]}"
          identity=$(security find-identity -v -p codesigning "$keychain" | awk '/Developer ID Application/ { print $2; exit }')
          [[ -n "$identity" ]] || { echo "the certificate holds no Developer ID Application identity" >&2; exit 1; }
          echo "NGTEAMS_MACOS_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
      - name: ngteams.app, its zip and its dmg
        env:
          NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY_P8 }}
          NGTEAMS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          NGTEAMS_NOTARY_ISSUER: ${{ secrets.MACOS_NOTARY_ISSUER }}
        run: |
          if [[ -n "$NOTARY_KEY" && -n "${NGTEAMS_MACOS_SIGN_IDENTITY:-}" ]]; then
            export NGTEAMS_NOTARY_KEY="$RUNNER_TEMP/notary.p8"
            printf '%s' "$NOTARY_KEY" > "$NGTEAMS_NOTARY_KEY"
          fi
          scripts/package-macos.sh --binaries target/release --gstreamer "$RUNNER_TEMP/gstreamer" --version "$VERSION" --out dist
          rm -f "$RUNNER_TEMP/notary.p8"
      - name: Verify the packaged app
        run: |
          smoke="$RUNNER_TEMP/macos-release-smoke"
          mkdir "$smoke"
          ditto -x -k "dist/ngteams-$VERSION-macos-arm64.zip" "$smoke"
          app="$smoke/ngteams.app"
          codesign --verify --strict --deep "$app"
          [[ "$(cat "$app/Contents/Resources/ngteams/update-format")" == macos-app ]]
          [[ "$(cat "$app/Contents/Resources/ngteams/release")" == "$VERSION" ]]
          # nothing may link the build's GStreamer prefix: the user's Mac has none. Only otool's tab-indented library
          # lines are checked, whole (a path may hold spaces): its "<file>:" headers are under RUNNER_TEMP too.
          for program in "$app"/Contents/MacOS/*; do
            linked=$(otool -L -arch all "$program" | awk '/^\t/')
            [[ -n "$linked" ]] || { echo "::error::otool lists no libraries for ${program#"$app"/}"; exit 1; }
            if grep -F "$RUNNER_TEMP" <<< "$linked"; then
              echo "::error::${program#"$app"/} links the build's GStreamer prefix"
              exit 1
            fi
          done
          # display-free: the build identity and the control client's help touch no account or credential store
          identity=$("$app/Contents/MacOS/ngteams" --build-identity)
          [[ "$identity" == "$WORKSPACE_VERSION"$'\n'"$NGTEAMS_BUILD_COMMIT" ]] || { echo "build identity mismatch: $identity" >&2; exit 1; }
          "$app/Contents/MacOS/ngteamsctl" --help > /dev/null
      - name: Remove the signing keychain
        if: always()
        run: |
          if [[ -n "${SIGNING_KEYCHAIN:-}" ]]; then security delete-keychain "$SIGNING_KEYCHAIN"; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        with:
          name: release-macos-arm64
          path: |
            dist/*.zip
            dist/*.dmg
          if-no-files-found: error

  publish:
    if: github.ref == 'refs/heads/main' && !inputs.coverage_only
    needs: [build, windows, macos, tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
      RELEASE_TAG: ${{ needs.build.outputs.tag }}
      WEB_ENGINE_KEY: ${{ needs.build.outputs.web_engine_key }}
      WEB_ENGINE_ARCHIVE: ${{ needs.build.outputs.web_engine_archive }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: ${{ runner.temp }}/dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.windows.outputs.artifact_id }}
          path: ${{ runner.temp }}/dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.macos.outputs.artifact_id }}
          path: ${{ runner.temp }}/dist
      - name: Checksums and attestation subjects
        run: |
          cd "$RUNNER_TEMP/dist"
          # the runtime is attested but goes on its own release, so a release's SHA256SUMS checks with what it attaches
          assets=()
          for file in *; do
            [[ "$file" == "$WEB_ENGINE_ARCHIVE" ]] || assets+=("$file")
          done
          sha256sum -- "${assets[@]}" > SHA256SUMS
          cat SHA256SUMS
          cp SHA256SUMS "$RUNNER_TEMP/attested"
          sha256sum -- SHA256SUMS "$WEB_ENGINE_ARCHIVE" >> "$RUNNER_TEMP/attested"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: ${{ runner.temp }}/attested
      # Before the app release exists: nothing published may pin a runtime that is not there yet.
      - name: Web engine prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/release-web-engine.py publish "$RUNNER_TEMP/dist" "$GITHUB_SHA" "$WEB_ENGINE_KEY"
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # A rerun of a published release leaves it alone; a draft from a failed upload is replaced.
          err="$RUNNER_TEMP/release-view.err"
          if draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2> "$err")"; then
            if [[ "$draft" == false ]]; then
              echo "::notice::$RELEASE_TAG is published already: nothing to do"
              exit 0
            fi
            gh release delete "$RELEASE_TAG" --yes
          elif ! grep -q 'release not found' "$err"; then
            cat "$err" >&2
            exit 1
          fi
          # The previous app release, so generated notes never start at a `web-engine-<key>` release made at this commit.
          # Before the first app release there is no latest one, and `gh` prints the API's error in place of a tag.
          previous="$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name 2> /dev/null || true)"
          notes=()
          [[ "$previous" != v[0-9]* ]] || notes=(--notes-start-tag "$previous")
          cd "$RUNNER_TEMP/dist"
          assets=()
          for file in *; do
            [[ "$file" == "$WEB_ENGINE_ARCHIVE" ]] || assets+=("$file")
          done
          gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --latest --title "ngteams $RELEASE_TAG" \
            --notes "Built from commit $GITHUB_SHA." --generate-notes "${notes[@]}" -- "${assets[@]}"
