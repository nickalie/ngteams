# Grow this selection as the native port reaches the remaining platform boundaries.
name: Windows portability

on:
  push:
    branches: [main]
    paths:
      - '**'
      - '!**/*.md'
      - '!docs/**'
      # Keep build/test inputs aligned with coverage.yml.
      - '**/tests/fixtures/**'
      - vendor/gpui-pre/README.md
  pull_request:
    paths:
      - '**'
      - '!**/*.md'
      - '!docs/**'
      - '**/tests/fixtures/**'
      - vendor/gpui-pre/README.md
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  storage:
    name: Files, authentication, control IPC and runner (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the repository toolchain
        run: rustup show active-toolchain
      - name: Private Linux credential-service test dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y dbus-x11 gnome-keyring
      - name: Format
        run: cargo fmt -p teams-platform -p teams-log -p teams-store -p teams-auth -p teams-ctl -p teams-runner -p teams-update -- --check
      - name: Check every target
        run: cargo check --locked -p teams-platform -p teams-log -p teams-store -p teams-auth -p teams-ctl -p teams-runner -p teams-update --all-targets
      - name: Lints
        run: cargo clippy --locked -p teams-platform -p teams-log -p teams-store -p teams-auth -p teams-ctl -p teams-runner -p teams-update --all-targets -- -D warnings
      - name: Offline filesystem, authentication, broker, native startup and update tests
        run: cargo test --locked -p teams-platform -p teams-log -p teams-store -p teams-auth -p teams-ctl -p teams-runner -p teams-update -- --test-threads=1
      - name: Windows coverage tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          rustup component add llvm-tools-preview
          cargo install cargo-llvm-cov --version 0.9.1 --locked
      - name: Require 90% native Windows filesystem coverage
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo llvm-cov clean --workspace
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo llvm-cov --locked -p teams-platform --fail-under-lines 90 --fail-under-functions 90 --fail-under-regions 90
      - name: Require the authentication crate's native coverage floors
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo llvm-cov clean --workspace
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $floors = python -c "import json, tomllib; print(json.dumps(tomllib.load(open('coverage.toml', 'rb'))['baselines']['teams-auth']))" | ConvertFrom-Json
          cargo llvm-cov --locked -p teams-auth --fail-under-lines $floors.lines --fail-under-functions $floors.functions --fail-under-regions $floors.regions
      - name: Require the control crate's native coverage floors
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo llvm-cov clean --workspace
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $floors = python -c "import json, tomllib; print(json.dumps(tomllib.load(open('coverage.toml', 'rb'))['baselines']['teams-ctl']))" | ConvertFrom-Json
          cargo llvm-cov --locked -p teams-ctl --fail-under-lines $floors.lines --fail-under-functions $floors.functions --fail-under-regions $floors.regions -- --test-threads=1
      - name: Require native runner coverage without a GUI or live client
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:CARGO_LLVM_COV_TARGET_DIR = "$pwd/target/llvm-cov-target"
          cargo llvm-cov clean --workspace
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo llvm-cov --locked -p teams-runner --no-report
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo llvm-cov run --locked -p teams-runner --no-report -- prepare --directory "$env:RUNNER_TEMP/ngteams-runner-prepare"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:LLVM_PROFILE_FILE = "$pwd/target/llvm-cov-target/runner-cli-%p-%m.profraw"
          ./scripts/test-windows-runner.ps1 -Runner "$pwd/target/llvm-cov-target/debug/teams-runner.exe" -SkipConsole
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo llvm-cov report --locked -p teams-runner --fail-under-lines 90 --fail-under-functions 90 --fail-under-regions 90

  signin:
    name: Native sign-in boundary (Windows)
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the repository toolchain
        run: rustup show active-toolchain
      - name: Format
        run: cargo fmt -p teams-signin -- --check
      - name: Compile every native sign-in target
        run: cargo check --locked -p teams-signin --all-targets
      - name: Lints
        run: cargo clippy --locked -p teams-signin --all-targets -- -D warnings
      - name: Offline guard and worker tests without a GUI or tenant
        run: cargo test --locked -p teams-signin --lib --test classify --test gate --test native_worker
      # Native browser windows are exercised only in the explicitly authorized win11 VM console.
